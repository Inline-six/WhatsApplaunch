<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Open WhatsApp</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(90%, 400px);
      padding: 40px 30px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      color: #222;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-radius: 10px;
      background: #25D366;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>WhatsApp</h1>
    <p>Tap below to open WhatsApp.</p>

    <button onclick="openWhatsApp()">
      Open WhatsApp
    </button>
  </div>

  <script>
    function openWhatsApp() {
      // Try to open the WhatsApp Android app
      window.location.href = "whatsapp://";

      // If WhatsApp isn't installed, open WhatsApp Web
      setTimeout(function () {
        window.location.href = "https://web.whatsapp.com/";
      }, 1500);
    }
  </script>

</body>
</html>
